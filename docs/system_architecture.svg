  <g transform="translate(905 270)">
    <rect x="0" y="0" width="230" height="190" class="box"/>
    <circle cx="70" cy="70" r="46" fill="#fff" stroke="#111" stroke-width="4"/>
    <path d="M24 70 H116 M70 24 C48 48,48 92,70 116 M70 24 C92 48,92 92,70 116 M37 42 C55 52,85 52,103 42 M37 98 C55 88,85 88,103 98" class="thin"/>
    <rect x="132" y="34" width="68" height="28" fill="#fff" stroke="#111" stroke-width="4"/>
    <rect x="132" y="76" width="68" height="28" fill="#fff" stroke="#111" stroke-width="4"/>
    <rect x="132" y="118" width="68" height="28" fill="#fff" stroke="#111" stroke-width="4"/>
    <circle cx="146" cy="48" r="4" fill="#111"/>
    <circle cx="146" cy="90" r="4" fill="#111"/>
    <circle cx="146" cy="132" r="4" fill="#111"/>
    <text x="115" y="228" class="label">Node.js Express API</text>
  </g>

  <!-- Database -->
  <g transform="translate(1210 310)">
    <ellipse cx="85" cy="32" rx="62" ry="24" fill="#fff" stroke="#111" stroke-width="4"/>
    <path d="M23 32 V142 C23 155,147 155,147 142 V32" fill="#fff" stroke="#111" stroke-width="4"/>
    <path d="M23 69 C23 82,147 82,147 69 M23 106 C23 119,147 119,147 106" class="thin"/>
    <text x="85" y="198" class="label">MongoDB Database</text>
