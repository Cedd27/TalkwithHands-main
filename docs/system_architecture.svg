  <g transform="translate(895 65)">
    <rect x="0" y="0" width="260" height="120" class="box"/>
    <circle cx="62" cy="52" r="28" fill="#fff" stroke="#111" stroke-width="4"/>
    <path d="M62 52 L62 28 M62 52 L82 64 M62 52 L42 68" class="thin"/>
    <text x="155" y="48" class="small">Firebase Core</text>
    <text x="155" y="76" class="small">Google / Facebook Login</text>
    <text x="130" y="154" class="label">External Auth Services</text>
  </g>

  <!-- Google Drive video storage -->
  <g transform="translate(900 595)">
    <rect x="0" y="0" width="245" height="120" class="box"/>
    <path d="M68 24 L110 24 L139 76 L97 76 Z" fill="#fff" stroke="#111" stroke-width="4"/>
    <path d="M110 24 L154 24 L196 96 L152 96 Z" fill="#fff" stroke="#111" stroke-width="4"/>
    <path d="M139 76 L196 96 L118 96 L97 76 Z" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="122" y="96" class="small">Video URL storage</text>
    <text x="122" y="154" class="label">Google Drive Videos</text>
  </g>

  <!-- Connections -->
  <path d="M245 295 L360 350" class="line2"/>
  <path d="M245 520 L360 405" class="line2"/>
  <path d="M575 368 L670 368" class="line2"/>
  <path d="M850 368 L900 368" class="line2"/>
  <path d="M1135 368 L1205 368" class="line2"/>
  <path d="M470 590 L470 465" class="line2"/>
  <path d="M1025 190 L1025 265" class="line2"/>
  <path d="M1025 590 L1025 465" class="line2"/>
  <path d="M900 650 C760 650, 670 510, 575 435" class="line"/>

  <!-- Flow notes -->
  <text x="303" y="300" class="small">learn signs</text>
  <text x="302" y="492" class="small">manage content</text>
  <text x="625" y="345" class="small">HTTPS</text>
  <text x="870" y="345" class="small">REST API</text>
  <text x="1172" y="345" class="small">Mongoose</text>
  <text x="760" y="635" class="small">play video_url</text>
</svg>
