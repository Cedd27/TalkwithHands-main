name: sign_language_app
description: Sign Language to Text and Speech — native mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.4
  camera_android: ^0.10.10+16

  # MediaPipe hand landmarks
  hand_landmarker: ^2.2.0
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.2
  google_fonts: ^6.3.3
  flutter_svg: ^2.0.0


  sqflite: ^2.4.1

  # Face mesh overlay
 # google_mlkit_face_mesh_detection: ^0.4.2

  # Text-to-speech
  flutter_tts: ^4.0.2

  # Permissions
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.6
  firebase_core: ^4.7.0
  dio: ^5.8.0+1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.3.0
  flutter_facebook_auth: ^7.1.1
  flutter_dotenv: ^6.0.0
  video_player: ^2.10.0
  cached_network_image: ^3.3.1
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.3
  confetti: ^0.8.0
  photo_view: ^0.15.0
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  flutter_shaders: ^0.1.3
  panorama_viewer: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

